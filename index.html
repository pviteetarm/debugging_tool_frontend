<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Assistant — UQ College</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #51247A;
    --purple-dark: #3B1A5A;
    --purple-tint: #F3EDF8;
    --purple-tint-2: #E7DAF0;
    --ink: #201A26;
    --muted: #6B6274;
    --border: #DCD3E3;
    --bg: #FBFAFC;
    --panel: #FFFFFF;
    --code-bg: #221A2E;
    --code-line: #3A2E4A;
    --code-text: #E6DFEE;
    --code-muted: #8B7F99;
    --unit: 8px;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: calc(var(--unit) * 5) calc(var(--unit) * 3) calc(var(--unit) * 8);
  }

  header {
    display: flex;
    align-items: center;
    gap: calc(var(--unit) * 2);
    margin-bottom: calc(var(--unit) * 5);
  }

  .mark {
    width: 40px;
    height: 40px;
    border-radius: 9px;
    background: var(--purple);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .mark svg { width: 20px; height: 20px; }

  header h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: calc(var(--unit) * 3);
    margin-bottom: calc(var(--unit) * 3);
  }

  label, .field-label-static {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--purple);
    margin-bottom: calc(var(--unit) * 1.5);
  }

  .code-field {
    position: relative;
    background: var(--code-bg);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--code-line);
  }

  .code-field .gutter {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 36px;
    background: rgba(255,255,255,0.02);
    border-right: 1px solid var(--code-line);
    padding: calc(var(--unit) * 2) 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
    color: var(--code-muted);
    text-align: center;
    user-select: none;
    pointer-events: none;
  }

  textarea#codeInput {
    width: 100%;
    min-height: 160px;
    background: transparent;
    border: none;
    outline: none;
    resize: vertical;
    color: var(--code-text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    padding: calc(var(--unit) * 2) calc(var(--unit) * 2) calc(var(--unit) * 2) 48px;
  }

  textarea#codeInput::placeholder { color: var(--code-muted); }

  textarea#issueInput {
    width: 100%;
    min-height: 80px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: calc(var(--unit) * 1.5) calc(var(--unit) * 2);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    resize: vertical;
    outline: none;
    transition: border-color 0.15s ease;
  }

  textarea#issueInput:focus { border-color: var(--purple); }
  textarea#issueInput::placeholder { color: #A79CB0; }

  .field-gap { height: calc(var(--unit) * 3); }

  .upload-row {
    display: flex;
    align-items: center;
    gap: calc(var(--unit) * 2);
    flex-wrap: wrap;
  }

  .upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--purple-tint);
    color: var(--purple);
    border: 1px dashed var(--purple-tint-2);
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .upload-btn:hover { background: var(--purple-tint-2); border-color: var(--purple); }

  .preview-thumb {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .preview-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .preview-thumb button {
    position: absolute;
    top: 2px; right: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: rgba(32, 26, 38, 0.75);
    color: white;
    border: none;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .bubble .thumb {
    max-width: 220px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
    margin-top: calc(var(--unit) * 1.5);
  }

  .bubble details {
    margin-top: calc(var(--unit) * 1);
  }

  .bubble details summary {
    cursor: pointer;
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 500;
  }

  .bubble details summary:hover { color: var(--purple); }

  .bubble details[open] summary { margin-bottom: 6px; }

  .bubble details img.thumb { max-width: 160px; margin-top: 0; }

  .fix-block {
    margin-top: calc(var(--unit) * 1.5);
  }

  .fix-block .fix-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .fix-block .fix-label span {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .copy-btn {
    background: var(--purple-tint);
    color: var(--purple);
    border: 1px solid var(--purple-tint-2);
    border-radius: 6px;
    padding: 4px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .copy-btn:hover { background: var(--purple-tint-2); }
  .copy-btn.copied { background: var(--purple); color: white; border-color: var(--purple); }

  .submit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: calc(var(--unit) * 3);
    gap: calc(var(--unit) * 2);
  }

  @media (max-width: 480px) {
    .submit-row {
      flex-direction: column;
      align-items: stretch;
      text-align: center;
    }
    .submit-row .hint { order: 2; }
    .submit-row button#submitBtn { order: 1; }
  }

  .hint { font-size: 12px; color: var(--muted); }

  button#submitBtn {
    background: var(--purple);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px 22px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button#submitBtn:hover { background: var(--purple-dark); }
  button#submitBtn:active { transform: scale(0.98); }
  button#submitBtn:disabled { background: #C4B6D1; cursor: not-allowed; }

  .thread {
    display: flex;
    flex-direction: column;
    gap: calc(var(--unit) * 2);
  }

  .thread:empty { display: none; }

  .bubble {
    max-width: 100%;
    padding: calc(var(--unit) * 2);
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.6;
    animation: rise 0.25s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble.teacher {
    background: var(--purple-tint);
    border: 1px solid var(--purple-tint-2);
    align-self: flex-end;
    max-width: 85%;
  }

  .bubble.agent {
    background: var(--panel);
    border: 1px solid var(--border);
    align-self: flex-start;
    max-width: 92%;
  }

  .bubble .who {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--purple);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .bubble.teacher .who { color: #7A5A97; }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--purple);
  }

  .dot.thinking { animation: pulse 1.1s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  .bubble pre {
    background: var(--code-bg);
    color: var(--code-text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    padding: calc(var(--unit) * 1.5);
    border-radius: 6px;
    overflow-x: auto;
    margin: calc(var(--unit) * 1.5) 0;
  }

  .followup {
    display: flex;
    gap: calc(var(--unit) * 1.5);
    margin-top: calc(var(--unit) * 3);
  }

  .followup input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
  }

  .followup input:focus { border-color: var(--purple); }

  .followup button {
    background: white;
    border: 1px solid var(--purple);
    color: var(--purple);
    border-radius: 8px;
    padding: 0 18px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .followup button:hover { background: var(--purple-tint); }

  .demo-flag {
    font-size: 11px;
    color: var(--muted);
    background: #FFF8E8;
    border: 1px solid #F0DDA0;
    border-radius: 6px;
    padding: 3px 8px;
    display: inline-block;
    margin-bottom: calc(var(--unit) * 3);
  }

  @media (prefers-reduced-motion: reduce) {
    .bubble, .dot.thinking { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 9L4 12L8 15" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 9L20 12L16 15" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <h1>Debug Assistant</h1>
      <p>Paste your code, describe what's wrong, get guided help — no coding background needed.</p>
    </div>
  </header>

  <div class="demo-flag" id="demoFlag">Demo mode — connect a backend to enable real responses. See DEMO_MODE in source.</div>

  <div class="card">
    <label for="accessCodeInput">Access code</label>
    <input type="password" id="accessCodeInput" placeholder="Ask your Learning Designer for this" style="width:100%; border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-family:'Inter',sans-serif; font-size:14px; outline:none;">
  </div>

  <div class="card">
    <label for="codeInput">Your code</label>
    <div class="code-field">
      <div class="gutter" id="gutter">1</div>
      <textarea id="codeInput" placeholder="Paste the HTML, CSS, or JavaScript that isn't working..." spellcheck="false"></textarea>
    </div>

    <div class="field-gap"></div>

    <label for="issueInput">What's going wrong?</label>
    <textarea id="issueInput" placeholder="e.g. The button doesn't change colour when I click it, and I'm not sure why."></textarea>

    <div class="field-gap"></div>

    <div class="field-label-static">Screenshot (optional)</div>
    <div class="upload-row">
      <button type="button" id="uploadBtn" class="upload-btn">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
          <path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Add a screenshot
      </button>
      <input type="file" id="screenshotInput" accept="image/*" style="display:none;">
      <div class="preview-thumb" id="previewThumb" style="display:none;">
        <img id="previewImg" alt="Screenshot preview">
        <button type="button" id="removeThumb" aria-label="Remove screenshot">&times;</button>
      </div>
    </div>

    <div class="submit-row">
      <span class="hint">Your code stays in this browser tab until you submit.</span>
      <button id="submitBtn">Get help</button>
    </div>
  </div>

  <div class="thread" id="thread"></div>

  <div class="followup" id="followupRow" style="display:none;">
    <input id="followupInput" type="text" placeholder="Ask a follow-up question...">
    <button id="followupBtn">Send</button>
  </div>

</div>

<script>
  const codeInput = document.getElementById('codeInput');
  const gutter = document.getElementById('gutter');
  const issueInput = document.getElementById('issueInput');
  const submitBtn = document.getElementById('submitBtn');
  const thread = document.getElementById('thread');
  const followupRow = document.getElementById('followupRow');
  const followupInput = document.getElementById('followupInput');
  const followupBtn = document.getElementById('followupBtn');

  // Keep the line-number gutter in sync with the code textarea
  function updateGutter() {
    const lines = codeInput.value.split('\n').length;
    let nums = '';
    for (let i = 1; i <= Math.max(lines, 8); i++) nums += i + '\n';
    gutter.textContent = '';
    nums.trim().split('\n').forEach(n => {
      const div = document.createElement('div');
      div.textContent = n;
      gutter.appendChild(div);
    });
  }
  codeInput.addEventListener('input', updateGutter);
  codeInput.addEventListener('scroll', () => { gutter.scrollTop = codeInput.scrollTop; });
  updateGutter();

  // --- Screenshot upload (preview only for now, see callAgent note below) ---
  const uploadBtn = document.getElementById('uploadBtn');
  const screenshotInput = document.getElementById('screenshotInput');
  const previewThumb = document.getElementById('previewThumb');
  const previewImg = document.getElementById('previewImg');
  const removeThumb = document.getElementById('removeThumb');
  let screenshotDataUrl = null;

  uploadBtn.addEventListener('click', () => screenshotInput.click());

  screenshotInput.addEventListener('change', () => {
    const file = screenshotInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      screenshotDataUrl = reader.result;
      previewImg.src = screenshotDataUrl;
      previewThumb.style.display = 'block';
    };
    reader.readAsDataURL(file);
  });

  removeThumb.addEventListener('click', () => {
    screenshotDataUrl = null;
    screenshotInput.value = '';
    previewThumb.style.display = 'none';
  });

  function addBubble(role, html, thinking = false) {
    const b = document.createElement('div');
    b.className = 'bubble ' + role;
    const who = role === 'teacher' ? 'You' : 'Debug Assistant';
    b.innerHTML = `<div class="who"><span class="dot ${thinking ? 'thinking' : ''}"></span>${who}</div><div class="body">${html}</div>`;
    thread.appendChild(b);
    b.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return b;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function copyToClipboard(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent;
      btn.textContent = 'Copied ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1600);
    });
  }
  window.copyToClipboard = copyToClipboard;

  let fixCounter = 0;
  function buildTeacherBubble(issue, code, screenshot) {
    let html = '';
    if (issue) html += `<p>${escapeHtml(issue)}</p>`;
    if (code) {
      const lineCount = code.split('\n').length;
      html += `<details><summary>Code you pasted (${lineCount} line${lineCount === 1 ? '' : 's'}) — click to review</summary><pre>${escapeHtml(code)}</pre></details>`;
    }
    if (screenshot) {
      html += `<details><summary>Screenshot attached — click to view</summary><img class="thumb" src="${screenshot}" alt="Screenshot the teacher attached"></details>`;
    }
    return html;
  }

  function buildAgentBubble(explanation, fixedCode) {
    let html = `<p>${escapeHtml(explanation)}</p>`;
    if (fixedCode) {
      fixCounter++;
      const id = 'fix-' + fixCounter;
      html += `
        <div class="fix-block">
          <div class="fix-label">
            <span>Corrected code — copy and paste over yours</span>
            <button class="copy-btn" onclick="copyToClipboard(document.getElementById('${id}').textContent, this)">Copy</button>
          </div>
          <pre id="${id}">${escapeHtml(fixedCode)}</pre>
        </div>`;
    }
    return html;
  }

  // ---------------------------------------------------------------------
  // BACKEND CONNECTION
  //
  // DEMO_MODE = true  -> uses the canned mock replies below (no server needed)
  // DEMO_MODE = false -> sends real requests to BACKEND_URL
  //
  // Once the backend is deployed on Render, set DEMO_MODE to false and
  // update BACKEND_URL to the real address Render gives you (see the
  // backend project's README for deployment steps).
  // ---------------------------------------------------------------------
  const DEMO_MODE = false;
  const BACKEND_URL = 'https://debug-assistant-backend.onrender.com/api/debug-chat';

  if (!DEMO_MODE) {
    document.getElementById('demoFlag').style.display = 'none';
  }

  // Remember the access code locally so a teacher only has to type it
  // once, not on every visit. This is a convenience for one browser, not
  // a login system — it stores nothing about who the person is.
  const accessCodeInput = document.getElementById('accessCodeInput');
  try {
    const savedCode = localStorage.getItem('debugAssistantAccessCode');
    if (savedCode) accessCodeInput.value = savedCode;
  } catch (e) {
    // Some browsers (private/incognito modes) block localStorage — fine,
    // the teacher just has to retype the code each visit in that case.
  }

  let conversationId = null;
  let directLineToken = null;
  let watermark = null;

  async function callAgent(payload) {
    if (DEMO_MODE) {
      // --- DEMO MOCK ---
      await new Promise(r => setTimeout(r, 900));
      if (payload.history.length === 0) {
        return {
          explanation: "The button isn't responding because the ID your JavaScript is listening for doesn't quite match the ID on the button in your HTML — they need to be spelled exactly the same, including capital letters. I've fixed the mismatch below.",
          fixedCode: '<button id="submitBtn">Click me</button>\n\n<scr' + 'ipt>\n  document.getElementById("submitBtn").addEventListener("click", function() {\n    alert("Button clicked!");\n  });\n</scr' + 'ipt>'
        };
      }
      return {
        explanation: "Good instinct to check. Open the browser console (right-click the page → Inspect → Console tab) and click the button again — any red error text that shows up there tells us exactly what's happening. Paste that error here and I'll explain it in plain terms.",
        fixedCode: null
      };
      // --- END DEMO MOCK ---
    }

    // --- REAL BACKEND CALL ---
    // Note: payload.screenshot is intentionally NOT sent — see the note
    // further up about confirming the agent can handle images first.
    const response = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code: payload.code,
        issue: payload.issue,
        conversationId,
        token: directLineToken,
        watermark,
        accessCode: accessCodeInput.value.trim()
      })
    });

    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      if (data.error === 'wrong_access_code') {
        throw new Error('WRONG_ACCESS_CODE');
      }
      if (data.error === 'daily_limit_reached') {
        throw new Error('DAILY_LIMIT_REACHED');
      }
      throw new Error(`Backend returned ${response.status}`);
    }

    // Got a real response — remember this access code for next time.
    try {
      localStorage.setItem('debugAssistantAccessCode', accessCodeInput.value.trim());
    } catch (e) {
      // localStorage unavailable — not critical, just skip remembering it.
    }

    const data = await response.json();
    conversationId = data.conversationId; // remember it so follow-ups continue the same chat
    directLineToken = data.token;         // must reuse the SAME token — a new one won't match this conversation
    watermark = data.watermark;           // bookmark so the next poll waits for something genuinely new
    return { explanation: data.explanation, fixedCode: data.fixedCode };
  }

  const history = [];

  function errorMessageFor(err) {
    if (err.message === 'WRONG_ACCESS_CODE') {
      return "That access code isn't right — check with your Learning Designer and try again.";
    }
    if (err.message === 'DAILY_LIMIT_REACHED') {
      return "This tool has reached its usage limit for today. Try again tomorrow, or let your Learning Designer know if this happens often.";
    }
    return 'Something went wrong reaching the assistant. Try again in a moment.';
  }

  async function handleSubmit() {
    const code = codeInput.value.trim();
    const issue = issueInput.value.trim();
    const screenshot = screenshotDataUrl;
    if (!code && !issue && !screenshot) return;

    submitBtn.disabled = true;
    addBubble('teacher', buildTeacherBubble(issue, code, screenshot));

    // Reset the upload control now that it's shown in the thread
    removeThumb.click();

    const thinkingBubble = addBubble('agent', 'Thinking…', true);

    try {
      const { explanation, fixedCode } = await callAgent({ code, issue, screenshot, history });
      thinkingBubble.remove();
      addBubble('agent', buildAgentBubble(explanation, fixedCode));
      history.push({ code, issue, explanation, fixedCode });
      followupRow.style.display = 'flex';
    } catch (err) {
      thinkingBubble.remove();
      addBubble('agent', `<p>${errorMessageFor(err)}</p>`);
    } finally {
      submitBtn.disabled = false;
    }
  }

  async function handleFollowup() {
    const msg = followupInput.value.trim();
    if (!msg) return;
    followupInput.value = '';
    addBubble('teacher', buildTeacherBubble(msg, '', null));
    const thinkingBubble = addBubble('agent', 'Thinking…', true);
    try {
      const { explanation, fixedCode } = await callAgent({ code: '', issue: msg, history });
      thinkingBubble.remove();
      addBubble('agent', buildAgentBubble(explanation, fixedCode));
      history.push({ code: '', issue: msg, explanation, fixedCode });
    } catch (err) {
      thinkingBubble.remove();
      addBubble('agent', `<p>${errorMessageFor(err)}</p>`);
    }
  }

  submitBtn.addEventListener('click', handleSubmit);
  followupBtn.addEventListener('click', handleFollowup);
  followupInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleFollowup(); });
</script>
</body>
</html>
